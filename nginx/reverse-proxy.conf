# /etc/nginx/conf.d/reverse-proxy.conf
#
# Configuration du reverse proxy Nginx en zone DMZ.
# Phase 4 : sécurisation et chiffrement (TLS, redirection HTTPS,
# restriction des méthodes HTTP, rate limiting).
#
# Adapter les IP / noms de domaine / chemins de certificats
# à votre environnement avant utilisation.

# Zone de limitation de débit : 10 requêtes/s par adresse IP cliente
limit_req_zone $binary_remote_addr zone=mylimit:10m rate=10r/s;

# --- Redirection HTTP -> HTTPS ---
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# --- Bloc HTTPS ---
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/pki/nginx/server.crt;
    ssl_certificate_key /etc/pki/nginx/private/server.key;

    # TLS 1.2 / 1.3 uniquement (ANSSI-PA-035)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!3DES:!RC4;
    ssl_prefer_server_ciphers on;

    # Masquage de la version du serveur
    server_tokens off;

    # En-têtes HTTP de sécurité
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Restriction des méthodes HTTP autorisées
    if ($request_method !~ ^(GET|POST|HEAD)$) {
        return 405;
    }

    # Limitation de débit (protection anti-DoS applicatif)
    limit_req zone=mylimit burst=20 nodelay;

    location / {
        proxy_pass http://192.168.229.20;   # adresse interne du serveur applicatif (LAN)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
