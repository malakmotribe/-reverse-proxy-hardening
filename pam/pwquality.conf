# /etc/security/pwquality.conf
#
# Politique de complexité des mots de passe locaux — Phase 3.
# Extraits pertinents à ajouter/modifier dans le fichier existant.

minlen = 12       # Longueur minimale : 12 caractères
dcredit = -1      # Au moins 1 chiffre
ucredit = -1      # Au moins 1 lettre majuscule
lcredit = -1      # Au moins 1 lettre minuscule
ocredit = -1      # Au moins 1 caractère spécial
maxrepeat = 3     # Interdit plus de 3 caractères identiques consécutifs
