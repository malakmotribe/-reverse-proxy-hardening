# /etc/ssh/sshd_config.d/hardening.conf
#
# Directives de durcissement SSH — Phase 3 (moindre privilège système)
# À placer dans /etc/ssh/sshd_config.d/ sur un système CentOS/RHEL
# (le fichier principal sshd_config inclut ce répertoire par défaut).
#
# Prérequis : une authentification par clé publique fonctionnelle doit
# être en place AVANT de désactiver PasswordAuthentication, sous peine
# de perdre l'accès au serveur.

# Bloque la connexion SSH directe en root
PermitRootLogin no

# Seule l'authentification par clé est acceptée
PasswordAuthentication no
PubkeyAuthentication yes

# Limite les tentatives d'authentification (anti force-brute)
MaxAuthTries 3

# Déconnexion automatique après ~10 minutes d'inactivité
ClientAliveInterval 300
ClientAliveCountMax 2
