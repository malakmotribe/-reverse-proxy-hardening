# /etc/sysctl.d/99-hardening.conf
#
# Durcissement de la configuration réseau du noyau — Phase 5.
# Appliquer avec : sudo sysctl -p /etc/sysctl.d/99-hardening.conf

# Désactive le transfert de paquets IP : le reverse proxy Nginx opère par
# retransmission applicative de requêtes, pas par routage de paquets.
net.ipv4.ip_forward = 0

# Active les SYN cookies : protection contre les attaques par saturation
# de connexions TCP (SYN flood).
net.ipv4.tcp_syncookies = 1
